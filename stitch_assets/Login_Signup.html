<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { transform: translate(10px, -20px) scale(1.1); opacity: 0.6; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        }

        .bg-grid-dots {
            background-image: radial-gradient(circle, rgba(107, 255, 189, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .orb-glow {
            filter: blur(80px);
            background: radial-gradient(circle, #6bfcbd 0%, rgba(107, 255, 189, 0) 70%);
            animation: float 8s ease-in-out infinite;
        }

        .glass-card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-focus-ring:focus-within {
            border-color: #6bfcbd;
            box-shadow: 0 0 15px rgba(107, 255, 189, 0.2);
        }
    </style>

<body class="bg-surface-container-lowest text-on-surface min-h-screen flex items-center justify-center overflow-hidden font-body-md">
<!-- Atmospheric Background Elements -->
<div class="fixed inset-0 z-0 bg-grid-dots"></div>
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] orb-glow rounded-full z-0"></div>
<!-- Login Shell -->
<main class="relative z-10 w-full max-w-[420px] px-margin-mobile md:px-0">
<div class="glass-card rounded-xl p-xl shadow-2xl">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center mb-md shadow-[0_0_20px_rgba(107,255,189,0.3)]">
<span class="material-symbols-outlined text-on-primary-container text-[32px]">bar_chart</span>
</div>
<h1 class="font-display-md text-display-md text-primary-fixed uppercase tracking-tighter">Cadence</h1>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-md bg-white text-black py-4 rounded-full font-label-lg transition-transform active:scale-95 hover:bg-neutral-100">
<svg height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<!-- Divider -->
<div class="flex items-center gap-md my-xl">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-md text-on-surface-variant uppercase">or email</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<!-- Form -->
<div class="space-y-lg" id="authForm">
<div class="space-y-xs group">
<label class="font-label-lg text-on-surface-variant text-sm block ml-1" for="email">Email Address</label>
<div class="relative flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest px-4 py-3 input-focus-ring transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3">mail</span>
<input class="bg-transparent border-none p-0 w-full focus:ring-0 text-on-surface placeholder-outline-variant font-body-md" id="email" placeholder="runner@cadence.ai" type="email"/>
</div>
</div>
<div class="space-y-xs group">
<label class="font-label-lg text-on-surface-variant text-sm block ml-1" for="password">Password</label>
<div class="relative flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest px-4 py-3 input-focus-ring transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3">lock</span>
<input class="bg-transparent border-none p-0 w-full focus:ring-0 text-on-surface placeholder-outline-variant font-body-md" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-full font-label-lg flex items-center justify-center gap-2 group transition-all hover:shadow-[0_0_25px_rgba(107,255,189,0.4)] active:scale-95 mt-xl" id="primaryCta">
<span id="ctaText">Sign in</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Toggle -->
<div class="mt-xl text-center">
<p class="text-on-surface-variant font-body-md">
<span id="toggleQuestion">Don't have an account?</span>
<button class="text-primary-fixed font-bold hover:underline underline-offset-4 ml-1" id="toggleBtn">Create Account</button>
</p>
</div>
</div>
<!-- Footer Help -->
<div class="mt-xl flex justify-center gap-xl">
<a class="font-label-md text-on-surface-variant hover:text-primary-fixed transition-colors" href="#">Privacy Policy</a>
<a class="font-label-md text-on-surface-variant hover:text-primary-fixed transition-colors" href="#">Support</a>
</div>
</main>
<script>
        const toggleBtn = document.getElementById('toggleBtn');
        const ctaText = document.getElementById('ctaText');
        const toggleQuestion = document.getElementById('toggleQuestion');
        const primaryCta = document.getElementById('primaryCta');
        let isSignUp = false;

        toggleBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            if (isSignUp) {
                ctaText.innerText = 'Start Running';
                toggleQuestion.innerText = 'Already a member?';
                toggleBtn.innerText = 'Sign In';
            } else {
                ctaText.innerText = 'Sign in';
                toggleQuestion.innerText = "Don't have an account?";
                toggleBtn.innerText = 'Create Account';
            }
        });

        // Basic form animation
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.02]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.02]');
            });
        });
    </script>
</body></html>
