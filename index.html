<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Cadence AI - The gamified AI running coach" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/vite.svg" />
    <meta name="theme-color" content="#050505" />
    <title>Cadence AI - The gamified AI running coach</title>
    <style>
      /* Layout specific styles */
      body {
        margin: 0;
        background-color: #050505;
        overflow: hidden;
      }
      
      #hero-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
      }

      .landing-container {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
        padding-left: 10vw;
        pointer-events: none; /* Let clicks pass through to canvas when clicking outside the card */
      }

      /* Mobile centering */
      @media (max-width: 768px) {
        .landing-container {
          justify-content: center;
          padding-left: 0;
          text-align: center;
        }
      }

      .marketing-content {
        width: 90%;
        max-width: 500px;
        position: relative;
        z-index: 10;
        pointer-events: auto; /* Re-enable clicks */
      }
      
      .hero-title {
        font-size: 4rem;
        line-height: 1.1;
        margin-bottom: 24px;
        background: linear-gradient(135deg, #fff 0%, #a0a0a0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .hero-subtitle {
        font-size: 1.2rem;
        color: var(--muted);
        margin-bottom: 40px;
        line-height: 1.6;
      }

      @media (max-width: 768px) {
        .hero-title {
          font-size: 3rem;
        }
      }
      
      .btn-cta {
        padding: 16px 40px;
        font-size: 1.1rem;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <!-- 3D Canvas Background -->
    <canvas id="hero-canvas"></canvas>
    
    <!-- Marketing Content Overlay -->
    <div class="landing-container">
      <div class="marketing-content animate-fade-in">
        <h1 class="hero-title heading">Run smarter.<br/>Level up.</h1>
        <p class="hero-subtitle">Experience the first AI running coach that turns your real-world miles into virtual progress. Connect your favorite tracker and start your journey today.</p>
        
        <button id="btn-start" class="primary btn-cta hover-scale glow-primary">
          Start Your Journey
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </div>
    
    <script type="module">
      import './src/style.css';
      import { init3D, triggerZoomTransition } from './src/hero3d.js';

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }

      // Initialize 3D scene
      init3D();

      // Handle CTA click
      const btnStart = document.getElementById('btn-start');
      btnStart.addEventListener('click', async () => {
        btnStart.style.opacity = '0.7';
        btnStart.style.pointerEvents = 'none';
        btnStart.innerHTML = 'Loading...';
        
        await triggerZoomTransition();
        window.location.href = '/login.html';
      });
    </script>
  </body>
</html>
