<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Cadence AI - Login" />
  <meta name="theme-color" content="#050505" />
  <title>Cadence AI - Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['Syne', 'sans-serif'],
            body: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            cadence: '#6EFFC0',
          },
          borderRadius: {
            DEFAULT: "9999px",
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #050505;
      margin: 0;
      color: white;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* Ambient background glow */
    .bg-glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(110,255,192,0.15) 0%, rgba(5,5,5,0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .liquid-glass-strong { 
      background: rgba(255, 255, 255, 0.02);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.15), inset 0 1px 1px rgba(110, 255, 192, 0.3);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass-strong::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(110, 255, 192, 0.6) 0%, rgba(255, 255, 255, 0.2) 20%, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, 0.2) 80%, rgba(110, 255, 192, 0.6) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.02);
      background-blend-mode: luminosity;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(110, 255, 192, 0.4) 0%, rgba(255, 255, 255, 0.1) 20%, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, 0.1) 80%, rgba(110, 255, 192, 0.2) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Override input styles */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active{
        -webkit-box-shadow: 0 0 0 30px #0a0a0a inset !important;
        -webkit-text-fill-color: white !important;
    }
  </style>
</head>
<body class="font-body flex items-center justify-center min-h-screen relative">
  <div class="bg-glow"></div>
  
  <div class="relative z-10 w-full max-w-md px-6">
    <div class="liquid-glass-strong rounded-[2rem] p-10 flex flex-col items-center text-center">
      
      <div class="w-16 h-16 liquid-glass rounded-full flex items-center justify-center mb-6">
        <span class="font-heading font-bold text-3xl text-white">C</span>
      </div>
      
      <h1 class="font-heading font-extrabold text-3xl text-white mb-2 tracking-tight">Acceso Rápido</h1>
      <p class="text-white/60 text-sm mb-8">Únete a la nueva era del entrenamiento híbrido sin contraseñas.</p>
      
      <!-- Google Auth -->
      <button id="btn-google" class="w-full liquid-glass hover:bg-white/5 transition-colors rounded-full px-6 py-3.5 flex items-center justify-center gap-3 mb-4 group">
        <svg viewBox="0 0 24 24" width="20" height="20" class="group-hover:scale-110 transition-transform">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span class="font-medium text-white">Continuar con Google</span>
      </button>

      <div class="flex items-center w-full my-6 text-white/30 text-xs uppercase tracking-widest">
        <div class="flex-1 border-t border-white/10"></div>
        <span class="px-4">O</span>
        <div class="flex-1 border-t border-white/10"></div>
      </div>

      <!-- Auth Form -->
      <form id="auth-form" class="w-full flex flex-col gap-3">
        <div class="relative w-full">
          <input 
            type="email" 
            id="email" 
            placeholder="tu@email.com" 
            required
            class="w-full bg-[#0a0a0a] border border-white/10 rounded-full px-5 py-3.5 text-white placeholder-white/40 focus:outline-none focus:border-cadence/50 transition-colors text-sm"
          />
        </div>
        <div class="relative w-full">
          <input 
            type="password" 
            id="password" 
            placeholder="Contraseña" 
            required
            class="w-full bg-[#0a0a0a] border border-white/10 rounded-full px-5 py-3.5 text-white placeholder-white/40 focus:outline-none focus:border-cadence/50 transition-colors text-sm"
          />
        </div>
        
        <button type="button" id="btn-auth" class="w-full bg-cadence text-black font-bold rounded-full px-6 py-3.5 hover:bg-[#7FFFCF] hover:scale-[1.02] transition-all flex items-center justify-center gap-2 mt-2">
          <span>Sign in &rarr;</span>
        </button>
      </form>

      <div class="mt-6 text-sm text-white/50">
        <span id="toggle-text">Don't have an account?</span> 
        <button type="button" id="toggle-action" class="text-cadence font-semibold hover:underline">Sign Up</button>
      </div>

      <div id="error-message" class="text-red-400 mt-4 text-xs hidden"></div>
      
    </div>
  </div>

  <script type="module">
    import './src/style.css';
    import { initAuth } from './src/auth.js';
    
    initAuth();
  </script>
</body>
</html>
