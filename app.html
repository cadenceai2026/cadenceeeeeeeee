<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/vite.svg" />
    <meta name="theme-color" content="#050505" />
    <title>Cadence AI - App</title>
    <style>
      /* Layout structure */
      body {
        margin: 0;
        background-color: var(--background);
      }
      .app-layout {
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      .sidebar {
        width: 80px;
        background: var(--surface);
        border-right: 1px solid var(--outline);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 0;
        z-index: 100;
      }
      .main-content {
        flex: 1;
        overflow-y: auto;
        position: relative;
        padding-bottom: 80px; /* Mobile nav space */
      }
      .nav-item {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        text-decoration: none;
        margin-bottom: 16px;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .nav-item.active {
        background: rgba(110, 255, 192, 0.1);
        color: var(--primary);
      }
      .nav-item:hover:not(.active) {
        background: var(--surface-high);
      }
      .nav-icon {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .nav-label {
        font-size: 0.65rem;
        margin-top: 4px;
        font-weight: 500;
      }
      .mobile-nav {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--surface);
        border-top: 1px solid var(--outline);
        height: 70px;
        z-index: 100;
        justify-content: space-around;
        align-items: center;
      }
      /* View container */
      .view-container {
        display: none;
        padding: 24px;
        max-width: 800px;
        margin: 0 auto;
        animation: fadeIn 0.3s ease;
      }
      .view-container.active {
        display: block;
      }
      
      @media (max-width: 768px) {
        .sidebar { display: none; }
        .mobile-nav { display: flex; }
        .main-content { padding-bottom: 70px; }
      }
      
      /* Common Components for Views */
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <!-- Desktop Navigation Rail -->
      <nav class="sidebar">
        <!-- Dashboard -->
        <a class="nav-item active" data-view="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          <span class="nav-label">Home</span>
        </a>
        <!-- Coach -->
        <a class="nav-item" data-view="coach">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
          <span class="nav-label">Coach</span>
        </a>
        <!-- Activities -->
        <a class="nav-item" data-view="activities">

        </a>
        <!-- Compete -->

          <span class="nav-label">Compete</span>

        <!-- Settings -->
        <a class="nav-item" data-view="settings" style="margin-top: auto; margin-bottom: 24px;">

          <span class="nav-label">Settings</span>
        </a>
      </nav>

      <!-- Main Content Area -->
      <main class="main-content" id="main-content">
        <!-- Dashboard View -->
        <div id="view-dashboard" class="view-container active">
          <!-- Dynamically loaded by app.js -->
        </div>

        <!-- Coach View -->
        <div id="view-coach" class="view-container">
          <!-- Dynamically loaded -->
        </div>

        <!-- Activities View -->
        <div id="view-activities" class="view-container">
          <!-- Dynamically loaded -->
        </div>

        <!-- Compete View -->
        <div id="view-compete" class="view-container">
          <!-- Dynamically loaded -->
        </div>

        <!-- Settings View -->
        <div id="view-settings" class="view-container">
          <!-- Dynamically loaded -->
        </div>
      </main>

      <!-- Mobile Navigation Bar -->
      <nav class="mobile-nav">
        <!-- Repeated items for mobile layout -->
        <a class="nav-item active" data-view="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        </a>
        <a class="nav-item" data-view="coach">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </a>
        <a class="nav-item" data-view="activities">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>
        </a>
        <a class="nav-item" data-view="compete">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v-2H4v6h16v-6h-2v2h-2v-5h-2v5z"/></svg>
        </a>
        <a class="nav-item" data-view="settings">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </a>
      </nav>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
